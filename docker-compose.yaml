name: shop-meal-rag

# Tất cả cổng hạ tầng chỉ bind 127.0.0.1 (không lộ ra mạng ngoài).
# Chạy app + hạ tầng:      docker compose up -d --build
# Chạy ingestion 1 lần:    docker compose --profile ingest run --rm ingestion

x-app-env: &app-env
  APP_ENV: docker
  QDRANT_URL: http://qdrant:6333
  REDIS_HOST: redis
  REDIS_PORT: 6379
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4          # ghim version, không dùng :latest
    container_name: shop-meal-rag-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [shop-meal-rag-network]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shop-meal-rag-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks: [shop-meal-rag-network]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  mysql:
    image: mysql:8.4
    container_name: shop-meal-rag-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shop_meal_chatbot}
      MYSQL_USER: ${MYSQL_USER:-rag_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [shop-meal-rag-network]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-meal-rag-chatbot
    restart: unless-stopped
    env_file: [.env]
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/models
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    networks: [shop-meal-rag-network]

  # Job nạp tri thức vào Qdrant (không chạy mặc định)
  ingestion:
    profiles: ["ingest"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment: *app-env
    command: ["python", "-m", "app.ingestion.cli", "full"]
    volumes:
      - model_cache:/models
      - ./data:/app/data
    depends_on:
      qdrant: { condition: service_healthy }
      mysql: { condition: service_healthy }
    networks: [shop-meal-rag-network]

volumes:
  qdrant_data:
  redis_data:
  mysql_data:
  model_cache:

networks:
  shop-meal-rag-network:
    driver: bridge
