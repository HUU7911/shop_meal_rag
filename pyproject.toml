[project]
name = "shop-meal-rag"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: cần Qdrant/MySQL/Redis đang chạy"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
